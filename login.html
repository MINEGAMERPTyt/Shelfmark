<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Log in - Shelfmark</title>

    <link
      rel="icon"
      type="image/png"
      href="assets/images/icons/Shelfmark_logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="assets/images/icons/Shelfmark_logo.png"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body data-guest-only="true">
    <header class="site-header">
      <nav class="navbar">
        <a href="index.html" class="brand">
          <span class="brand-icon">S</span>
          <span class="brand-name">Shelfmark</span>
        </a>

        <div class="nav-links">
          <a href="index.html">Home</a>

          <a href="collection.html" data-auth="user" hidden> Collection </a>

          <a href="add-game.html" data-auth="user" hidden> Add Game </a>
        </div>

        <div class="nav-account">
          <div class="nav-guest" data-auth="guest" hidden>
            <a href="login.html" class="login-link"> Log in </a>

            <a href="register.html" class="register-button"> Create account </a>
          </div>

          <div class="nav-user" data-auth="user" hidden>
            <a href="profile.html" class="nav-user-link" data-user-name>
              Account
            </a>

            <button
              type="button"
              class="logout-button"
              data-auth-action="logout"
            >
              Log out
            </button>
          </div>
        </div>
      </nav>
    </header>

    <main class="auth-page">
      <div class="auth-header">
        <p class="auth-eyebrow">Shelfmark account</p>

        <h1>Welcome back.</h1>

        <p class="auth-description">
          Log in to access your collection and continue building your archive.
        </p>
      </div>

      <form class="auth-form" id="login-form" novalidate>
        <div class="auth-field">
          <label for="login-email"> Email </label>

          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="auth-field">
          <label for="login-password"> Password </label>

          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="Your password"
            autocomplete="current-password"
            required
          />
        </div>

        <a href="forgot-password.html" class="auth-forgot-link">
          Forgot password?
        </a>

        <p class="auth-message" id="auth-message" aria-live="polite"></p>

        <button type="submit" class="auth-submit">Log in</button>
      </form>

      <p class="auth-switch">
        Don't have an account?
        <a href="register.html">Create one</a>
      </p>
    </main>

    <footer class="site-footer">
      <p>© 2026 Shelfmark</p>
      <p>A personal collection archive.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
