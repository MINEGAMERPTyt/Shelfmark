<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create account - Shelfmark</title>

    <meta
      name="description"
      content="Create a Shelfmark account to start cataloguing your collection."
    />

    <meta name="robots" content="noindex, nofollow" />

    <meta name="theme-color" content="#111111" />

    <link
      rel="icon"
      type="image/png"
      href="assets/images/icons/Shelfmark_logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="assets/images/icons/Shelfmark_logo.png"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body data-guest-only="true">
    <header class="site-header">
      <nav class="navbar">
        <a href="index.html" class="brand">
          <span class="brand-icon">S</span>
          <span class="brand-name">Shelfmark</span>
        </a>

        <div class="nav-links">
          <a href="index.html">Home</a>

          <a href="collection.html" data-auth="user" hidden> Collection </a>

          <a href="add-game.html" data-auth="user" hidden> Add Game </a>
        </div>

        <div class="nav-account">
          <div class="nav-guest" data-auth="guest" hidden>
            <a href="login.html" class="login-link"> Log in </a>

            <a href="register.html" class="register-button"> Create account </a>
          </div>

          <div class="nav-user" data-auth="user" hidden>
            <a href="profile.html" class="nav-user-link" data-user-name>
              Account
            </a>

            <button
              type="button"
              class="logout-button"
              data-auth-action="logout"
            >
              Log out
            </button>
          </div>
        </div>
      </nav>
    </header>

    <main class="auth-page">
      <div class="auth-header">
        <p class="auth-eyebrow">Shelfmark account</p>

        <h1>Create your archive.</h1>

        <p class="auth-description">
          Create an account to start cataloguing your physical collection.
        </p>
      </div>

      <form class="auth-form" id="register-form" novalidate>
        <div class="auth-field">
          <label for="register-username"> Username </label>

          <input
            type="text"
            id="register-username"
            name="username"
            placeholder="Your username"
            autocomplete="username"
            minlength="2"
            required
          />
        </div>

        <div class="auth-field">
          <label for="register-email"> Email </label>

          <input
            type="email"
            id="register-email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="auth-field">
          <label for="register-password"> Password </label>

          <input
            type="password"
            id="register-password"
            name="password"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </div>

        <div class="auth-field">
          <label for="register-confirm-password"> Confirm password </label>

          <input
            type="password"
            id="register-confirm-password"
            name="confirm-password"
            placeholder="Repeat your password"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </div>

        <p class="auth-message" id="auth-message" aria-live="polite"></p>

        <button type="submit" class="auth-submit">Create account</button>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </main>

    <footer class="site-footer">
      <div>
        <p>© 2026 Shelfmark</p>
        <p>A personal collection archive.</p>
      </div>

      <nav class="site-footer-links" aria-label="Footer">
        <a href="privacy.html"> Privacy </a>

        <a
          href="https://github.com/MINEGAMERPTyt/Shelfmark"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub
        </a>
      </nav>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
