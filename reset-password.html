<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Reset Password - Shelfmark</title>

    <meta name="robots" content="noindex, nofollow" />

    <meta name="theme-color" content="#111111" />

    <link
      rel="icon"
      type="image/png"
      href="assets/images/icons/Shelfmark_logo.png"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body>
    <header class="site-header">
      <nav class="navbar">
        <a href="index.html" class="brand">
          <span class="brand-icon">S</span>
          <span class="brand-name">Shelfmark</span>
        </a>

        <div class="nav-links">
          <a href="index.html">Home</a>
        </div>

        <div class="nav-account"></div>
      </nav>
    </header>

    <main class="auth-page">
      <header class="auth-header">
        <p class="auth-eyebrow">Account recovery</p>

        <h1>Choose a new password.</h1>

        <p class="auth-description">
          Enter a new password for your Shelfmark account.
        </p>
      </header>

      <form class="auth-form" id="password-update-form" novalidate>
        <div class="auth-field">
          <label for="new-password"> New password </label>

          <input
            type="password"
            id="new-password"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </div>

        <div class="auth-field">
          <label for="confirm-new-password"> Confirm new password </label>

          <input
            type="password"
            id="confirm-new-password"
            autocomplete="new-password"
            minlength="8"
            required
          />
        </div>

        <p class="auth-field-note">Use at least 8 characters.</p>

        <p
          class="auth-message"
          id="password-update-message"
          aria-live="polite"
        ></p>

        <button
          type="submit"
          class="auth-submit"
          id="password-update-submit"
          disabled
        >
          Update password
        </button>
      </form>

      <p class="auth-switch">
        <a href="login.html"> Return to log in </a>
      </p>
    </main>

    <footer class="site-footer">
      <div>
        <p>© 2026 Shelfmark</p>
        <p>A personal collection archive.</p>
      </div>

      <nav class="site-footer-links" aria-label="Footer">
        <a href="privacy.html"> Privacy </a>

        <a
          href="https://github.com/MINEGAMERPTyt/Shelfmark"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub
        </a>
      </nav>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/password-recovery.js"></script>
  </body>
</html>
